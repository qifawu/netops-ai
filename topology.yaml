# Sample topology of the reference lab / 参考实验环境的拓扑
#
# This file is versioned lab fact, not runtime evidence: the agent reads it through the
# `topology_neighbors` tool and the dashboard draws its topology page from it. The addresses
# are documentation addresses (RFC 5737); replace them with your own.
# 这是版本化的实验室事实，不是运行时证据：agent 通过 `topology_neighbors` 工具读它，
# 看板的拓扑页也从它画。地址是文档保留段（RFC 5737），换成你自己的。
#
# Shape / 结构: three layers, 7 Cisco nodes, see docs/LAB.md
#   core        V1, V2          (IOSv)     - routed, OSPF + a BGP session between them
#   aggregation D1, D2          (IOSv)     - routed uplinks, bridge irb + BVI as VLAN gateways
#   access      A1, A2, A3      (IOSv-L2)  - layer 2, management IP on the Vlan1 SVI
#
# Fields / 字段:
#   name        the name used in this file and in playbooks / 本文件和剧本里用的名字
#   host        out-of-band management IP the agent connects to / agent 连接用的带外管理地址
#   role        core | aggregation | access (drives the layered drawing / 决定分层绘制)
#   aliases     other names for the same device, typically the Zabbix host name / 同一设备的其它名字，
#               通常是 Zabbix 里的主机名
#   links       local_interface <-> peer / peer_interface
#
# Why aliases are explicit / 为什么别名要显式写:
#   The same device has different names in different systems: `V1` here, `V1-vios` in Zabbix,
#   and possibly a third one as its own hostname. There is deliberately NO fuzzy matching
#   (no suffix stripping): a guess that is wrong goes unnoticed, while a missing alias is a visible
#   configuration error. When a lookup returns nothing the agent cannot tell the device from a
#   typo, and that part of the incident ends up "low confidence, needs a human".
#   同一台设备在不同系统里叫不同名字（这里 V1，Zabbix 里 V1-vios，设备自己的 hostname 可能还有
#   第三种）。故意不做模糊匹配（比如去后缀）：猜错了没人知道，别名漏写却是看得见的配置错误。
#   查不到时 agent 分不清「设备不存在」还是「名字写错」，那一侧的结论会落成「低置信、需要人工」。
#
# Devices that are not managed (for example a test server behind the access layer) are not listed
# here on purpose: listing one would draw a device on the topology page that cannot be queried.
# 不纳管的设备（比如接入层后面的测试服务器）故意不登记：登记了拓扑页上就会多出一台查不到的设备。

devices:
  - name: V1
    host: 192.0.2.50          # 管理口 Gi0/0，带外
    role: core
    aliases:
      - V1-vios              # Zabbix 主机名
    links:
      - local_interface: GigabitEthernet0/1   # 业务口，10.0.0.0/30
        peer: V2
        peer_interface: GigabitEthernet0/1
      - local_interface: GigabitEthernet0/2   # 10.0.1.0/30
        peer: D1
        peer_interface: GigabitEthernet0/1
      - local_interface: GigabitEthernet0/3   # 10.0.1.4/30
        peer: D2
        peer_interface: GigabitEthernet0/1

  - name: V2
    host: 192.0.2.51          # 管理口 Gi0/0，带外
    role: core
    aliases:
      - V2-vios              # Zabbix 主机名
    links:
      - local_interface: GigabitEthernet0/1
        peer: V1
        peer_interface: GigabitEthernet0/1
      - local_interface: GigabitEthernet0/2   # 10.0.1.8/30
        peer: D1
        peer_interface: GigabitEthernet0/2
      - local_interface: GigabitEthernet0/3   # 10.0.1.12/30
        peer: D2
        peer_interface: GigabitEthernet0/2

  - name: D1
    host: 192.0.2.52          # 管理口 GigabitEthernet0/0，带外，vIOS（IOSv）镜像
    role: aggregation
    aliases:
      - D1-vios               # Zabbix 主机名
    links:
      - local_interface: GigabitEthernet0/1   # 10.0.1.0/30
        peer: V1
        peer_interface: GigabitEthernet0/2
      - local_interface: GigabitEthernet0/2   # 10.0.1.8/30
        peer: V2
        peer_interface: GigabitEthernet0/2
      - local_interface: GigabitEthernet0/3   # 10.0.1.16/30
        peer: D2
        peer_interface: GigabitEthernet0/3
      - local_interface: GigabitEthernet0/4   # 二层接入口，bridge-group 11，无独立 IP
        peer: A1
        peer_interface: GigabitEthernet0/1
      - local_interface: GigabitEthernet0/5   # bridge-group 11
        peer: A2
        peer_interface: GigabitEthernet0/1

  - name: D2
    host: 192.0.2.53          # 管理口 GigabitEthernet0/0，带外，vIOS（IOSv）镜像
    role: aggregation
    aliases:
      - D2-vios
    links:
      - local_interface: GigabitEthernet0/1   # 10.0.1.4/30
        peer: V1
        peer_interface: GigabitEthernet0/3
      - local_interface: GigabitEthernet0/2   # 10.0.1.12/30
        peer: V2
        peer_interface: GigabitEthernet0/3
      - local_interface: GigabitEthernet0/3   # 10.0.1.16/30
        peer: D1
        peer_interface: GigabitEthernet0/3
      - local_interface: GigabitEthernet0/4   # bridge-group 13
        peer: A3
        peer_interface: GigabitEthernet0/1

  - name: A1
    host: 192.0.2.54          # 管理 IP 配在 Vlan1 SVI 上，不是物理口；viosl2 镜像
    role: access
    aliases:
      - A1-viosl2
    links:
      - local_interface: GigabitEthernet0/1
        peer: D1
        peer_interface: GigabitEthernet0/4

  - name: A2
    host: 192.0.2.55          # viosl2 镜像
    role: access
    aliases:
      - A2-viosl2
    links:
      - local_interface: GigabitEthernet0/1
        peer: D1
        peer_interface: GigabitEthernet0/5

  - name: A3
    host: 192.0.2.56          # viosl2 镜像
    role: access
    aliases:
      - A3-viosl2
    links:
      - local_interface: GigabitEthernet0/1
        peer: D2
        peer_interface: GigabitEthernet0/4
