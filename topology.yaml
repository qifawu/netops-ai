# 本 lab 的物理拓扑。**这是版本化的实验室事实，不是运行时证据。**
#
# ── aliases 是干嘛的 ──
#
# 同一台设备在不同系统里叫不同名字：
#   topology.yaml 里叫 V1        （网工画拓扑时的习惯叫法）
#   Zabbix 里叫     V1-vios      （建主机时带上了平台后缀）
#   设备自己的 hostname 又可能是第三种
#
# 的端到端演示里，agent 拿着 Zabbix 给它的 "V2-vios" 来查拓扑，
# 三次全部查空，V2 侧因此给出「低置信、需要人工介入」——而同一次故障
# V1 侧是高置信的。**一个命名不一致，直接让半个故障判不出来。**
#
# 所以别名必须显式登记。不做后缀剥离之类的模糊匹配：那是猜，猜错了
# 没人知道；写在这里写错了是配置错误，看得见、改得动。
#
# 加设备时记得把它在 Zabbix 里的主机名一并写进 aliases。
#
# ── 从 2 台扩到 8 台（A9 三层拓扑）──
#
# 核心两台沿用 V1/V2 原名，没有改成 C1/C2——V1/V2 在 Zabbix、playbooks、mock
# 抓包等好几处已经被引用，改名影响面太大。D1/D2（汇聚）、A1~A3（接入）当时
# 全部用 IOL 镜像（不是 vios/viosl2）：宿主物理内存实测只有 1.9~3.5GB 空闲，
# 6 台 QEMU 类设备跑不起，IOL 是 dynamips，每台只要几十 MB。管理口 IP 接着
# V1=.50/V2=.51 往下排到 .56。
#
# ── D1/D2/A1~A3 全部换成 vIOS/viosl2（收窄）──
#
# 起因：实测 IOL L2 不发 linkDown trap、IOL L3 连 `enable traps config`
# 都被拒——拿一台做不了最基本 NMS 动作的设备写教程是残的。真机重新算过内存：
# 之前记的「1.9~3.5GB 空闲」是当时某一刻的读数，不是天花板；宿主实际 16G，
# 全部换完 `free -m` 显示 available 11171 MB，8 台 vIOS/viosl2 加现网 SRV/AR1
# 全部进程 RSS 合计约 3.0 GB。**内存够，之前判断错了。**
#
# 接口名跟着镜像变了：D1/D2 是 vIOS（IOSv），A1~A3 是 viosl2，全系
# GigabitEthernet0/x 命名（IOL 时代的 Ethernet0/x → GigabitEthernet0/x，
# Ethernet1/x → GigabitEthernet0/(4+x)）。管理 IP 没变；-F
# 又把接入层 Zabbix 主机名从 A1/A2/A3-iol 改成 A1/A2/A3-viosl2，跟镜像对齐。
#
# D1/D2 现在用经典 `bridge irb` + BVI 做 VLAN 网关（D1 的 BVI11 = 10.1.1.1/24，
# D2 的 BVI13 = 10.1.3.1/24），接 SRV 的口在 A1/A2/A3 的 GigabitEthernet0/2
# 上（A1/A2 access VLAN 11，A3 access VLAN 13）。SRV 本身不纳管，
# topology.yaml 里不登记它的线缆——道理跟以前一样：登记了就会在拓扑图上
# 多出一台查不到的设备。

devices:
  - name: V1
    host: 192.0.2.50          # 管理口 Gi0/0，带外
    role: core
    aliases:
      - V1-vios              # Zabbix 主机名
    links:
      - local_interface: GigabitEthernet0/1   # 业务口，10.0.0.0/30
        peer: V2
        peer_interface: GigabitEthernet0/1
      - local_interface: GigabitEthernet0/2   # 10.0.1.0/30
        peer: D1
        peer_interface: GigabitEthernet0/1
      - local_interface: GigabitEthernet0/3   # 10.0.1.4/30
        peer: D2
        peer_interface: GigabitEthernet0/1

  - name: V2
    host: 192.0.2.51          # 管理口 Gi0/0，带外
    role: core
    aliases:
      - V2-vios              # Zabbix 主机名
    links:
      - local_interface: GigabitEthernet0/1
        peer: V1
        peer_interface: GigabitEthernet0/1
      - local_interface: GigabitEthernet0/2   # 10.0.1.8/30
        peer: D1
        peer_interface: GigabitEthernet0/2
      - local_interface: GigabitEthernet0/3   # 10.0.1.12/30
        peer: D2
        peer_interface: GigabitEthernet0/2

  - name: D1
    host: 192.0.2.52          # 管理口 GigabitEthernet0/0，带外，vIOS（IOSv）镜像
    role: aggregation
    aliases:
      - D1-vios               # Zabbix 主机名
    links:
      - local_interface: GigabitEthernet0/1   # 10.0.1.0/30
        peer: V1
        peer_interface: GigabitEthernet0/2
      - local_interface: GigabitEthernet0/2   # 10.0.1.8/30
        peer: V2
        peer_interface: GigabitEthernet0/2
      - local_interface: GigabitEthernet0/3   # 10.0.1.16/30
        peer: D2
        peer_interface: GigabitEthernet0/3
      - local_interface: GigabitEthernet0/4   # 二层接入口，bridge-group 11，无独立 IP
        peer: A1
        peer_interface: GigabitEthernet0/1
      - local_interface: GigabitEthernet0/5   # bridge-group 11
        peer: A2
        peer_interface: GigabitEthernet0/1

  - name: D2
    host: 192.0.2.53          # 管理口 GigabitEthernet0/0，带外，vIOS（IOSv）镜像
    role: aggregation
    aliases:
      - D2-vios
    links:
      - local_interface: GigabitEthernet0/1   # 10.0.1.4/30
        peer: V1
        peer_interface: GigabitEthernet0/3
      - local_interface: GigabitEthernet0/2   # 10.0.1.12/30
        peer: V2
        peer_interface: GigabitEthernet0/3
      - local_interface: GigabitEthernet0/3   # 10.0.1.16/30
        peer: D1
        peer_interface: GigabitEthernet0/3
      - local_interface: GigabitEthernet0/4   # bridge-group 13
        peer: A3
        peer_interface: GigabitEthernet0/1

  - name: A1
    host: 192.0.2.54          # 管理 IP 配在 Vlan1 SVI 上，不是物理口；viosl2 镜像
    role: access
    aliases:
      - A1-viosl2
    links:
      - local_interface: GigabitEthernet0/1
        peer: D1
        peer_interface: GigabitEthernet0/4

  - name: A2
    host: 192.0.2.55          # viosl2 镜像
    role: access
    aliases:
      - A2-viosl2
    links:
      - local_interface: GigabitEthernet0/1
        peer: D1
        peer_interface: GigabitEthernet0/5

  - name: A3
    host: 192.0.2.56          # viosl2 镜像
    role: access
    aliases:
      - A3-viosl2
    links:
      - local_interface: GigabitEthernet0/1
        peer: D2
        peer_interface: GigabitEthernet0/4
