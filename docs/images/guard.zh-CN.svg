" y1="385" x2="913" y2="385" stroke="#e1e5e9" stroke-width="1"></line><text id="t28" x="699" y="403" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#3b4754">万一第一层被绕过</text><path d="M 305 376 L 138 376 L 138 271.5" fill="none" stroke="#5b6774" stroke-width="1.4" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#m5b6774)"></path><rect rx="2" fill="#ffffff" x="176.9" y="354.5" width="88.3" height="18.0"></rect><text id="t29" x="221" y="368" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11.5" fill="#5d6a77" text-anchor="middle">原因回给 agent</text><rect x="24" y="444" width="582" height="182" rx="3" fill="#ffffff" stroke="#b8c1ca" stroke-width="1.25"></rect><rect x="24.6" y="444.6" width="580.8" height="29" fill="#fafbfc"></rect><line x1="24" y1="474" x2="606" y2="474" stroke="#e1e5e9" stroke-width="1"></line><text id="t30" x="40" y="463" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11.5" fill="#5d6a77" font-weight="700">第一层规则</text><rect x="41" y="492.5" width="5" height="5" fill="#1f5fae"></rect><text id="t31" x="56" y="500" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#3b4754">只认写全的命令，不认缩写（<tspan font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12">sh</tspan>、<tspan font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12">conf t</tspan> 会被拒）</text><rect x="41" y="520.5" width="5" height="5" fill="#1f5fae"></rect><text id="t32" x="56" y="528" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#3b4754">先查禁令，再查放行</text><rect x="41" y="548.5" width="5" height="5" fill="#1f5fae"></rect><text id="t33" x="56" y="556" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#3b4754">管道后只允许一个过滤词：<tspan font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12">include</tspan> / <tspan font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12">exclude</tspan> / <tspan font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12">begin</tspan> / <tspan font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12">section</tspan> / <tspan font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12">count</tspan></text><rect x="41" y="576.5" width="5" height="5" fill="#1f5fae"></rect><text id="t34" x="56" y="584" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#3b4754">拒绝 shell 元字符、控制字符和非 ASCII；最长 200 字符</text><rect x="41" y="604.5" width="5" height="5" fill="#1f5fae"></rect><text id="t35" x="56" y="612" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#3b4754"><tspan font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12">ping</tspan> / <tspan font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12">traceroute</tspan> 默认关闭，需显式开启</text><rect x="624" y="444" width="552" height="98" rx="3" fill="#ffffff" stroke="#b8c1ca" stroke-width="1.25"></rect><rect x="624.6" y="444.6" width="550.8" height="29" fill="#fafbfc"></rect><line x1="624" y1="474" x2="1176" y2="474" stroke="#e1e5e9" stroke-width="1"></line><text id="t36" x="640" y="463" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11.5" fill="#5d6a77" font-weight="700">第二层注意</text><rect x="641" y="492.5" width="5" height="5" fill="#1f5fae"></rect><text id="t37" x="656" y="500" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12.5" fill="#3b4754">IOS 上如果 <tspan font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="12">enable</tspan> 没设