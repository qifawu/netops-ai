a">rejected</text><rect rx="2" fill="#ffffff" x="809.0" y="326.5" width="62.5" height="18.0"></rect><text id="t32" x="813" y="340" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#c2551a">if bypassed</text><rect x="305" y="366" width="240" height="104" rx="3" fill="#ffffff" stroke="#c2551a" stroke-width="1.25"></rect><rect x="317" y="378" width="26" height="26" rx="3" fill="#c2551a"></rect><g transform="translate(318.82,379.82) scale(0.93)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"></circle><path d="m9 9 6 6M15 9l-6 6"></path></g><text id="t33" x="353" y="391" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13.5" fill="#1d2731" font-weight="600">Rejected</text><text id="t34" x="353" y="408" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11.5" fill="#7f8a96">被拒绝</text><line x1="317" y1="420" x2="533" y2="420" stroke="#e1e5e9" stroke-width="1"></line><text id="t35" x="319" y="439" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3b4754">reason is returned to the agent</text><text id="t36" x="319" y="456" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11.5" fill="#7f8a96">原因原样返回给 agent</text><rect x="685" y="366" width="240" height="104" rx="3" fill="#ffffff" stroke="#c2551a" stroke-width="1.25"></rect><rect x="697" y="378" width="26" height="26" rx="3" fill="#c2551a"></rect><g transform="translate(698.82,379.82) scale(0.93)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"></circle><path d="m9 9 6 6M15 9l-6 6"></path></g><text id="t37" x="733" y="391" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13.5" fill="#1d2731" font-weight="600">Refused by the device</text><text id="t38" x="733" y="408" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11.5" fill="#7f8a96">设备自己拒绝</text><line x1="697" y1="420" x2="913" y2="420" stroke="#e1e5e9" stroke-width="1"></line><text id="t39" x="699" y="439" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3b4754">if layer 1 were ever bypassed</text><text id="t40" x="699" y="456" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11.5" fill="#7f8a96">万一第一层被绕过</text><path d="M 305 426 L 138 426 L 138 298.5" fill="none" stroke="#5b6774" stroke-width="1.4" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#m5b6774)"></path><rect rx="2" fill="#ffffff" x="179.1" y="404.5" width="84.1" height="18.0"></rect><text id="t41" x="221" y="418" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#5d6a77" text-anchor="middle">reason → agent</text><rect rx="2" fill="#ffffff" x="178.6" y="428.5" width="84.1" height="18.0"></rect><text id="t42" x="221" y="442" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7f8a96" text-anchor="middle">原因回给 agent</text><rect x="24" y="506" width="582" height="246" rx="3" fill="#ffffff" stroke="#b8c1ca" stroke-width="1.25"></rect><rect x="24.6" y="506.6" width="580.8" height="32" fill="#fafbfc"></rect><line x1="24" y1="539" x2="606" y2="539" stroke="#e1e5e9" stroke-width="1"></line><text id="t43" x="40" y="527" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="10" fill="#5d6a77" font-weight="700" letter-spacing="1">LAYER 1 RULES · 第一层规则</text><rect x="41" y="556.5" width="5" height="5" fill="#1f5fae"></rect><text id="t44" x="56" y="564" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3b4754">Full commands only — no abbreviations (<tspan font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5">sh</tspan>, <tspan font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5">conf t</tspan> rejected)</text><text id="t45" x="56" y="580" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7f8a96">只认写全的命令，不认缩写</text><rect x="41" y="596.5" width="5" height="5" fill="#1f5fae"></rect><text id="t46" x="56" y="604" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3b4754">Forbidden verbs are checked before allowed ones</text><text id="t47" x="56" y="620" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7f8a96">先查禁令，再查放行</text><rect x="41" y="636.5" width="5" height="5" fill="#1f5fae"></rect><text id="t48" x="56" y="644" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3b4754">One optional pipe: <tspan font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5">include</tspan> / <tspan font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5">exclude</tspan> / <tspan font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5">begin</tspan> / <tspan font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5">section</tspan> / <tspan font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5">count</tspan></text><text id="t49" x="56" y="660" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7f8a96">管道后只允许这五个过滤词</text><rect x="41" y="676.5" width="5" height="5" fill="#1f5fae"></rect><text id="t50" x="56" y="684" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3b4754">No shell metacharacters, control chars or non-ASCII; ≤ 200 chars</text><text id="t51" x="56" y="700" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7f8a96">拒绝 shell 元字符、控制字符、非 ASCII；不超过 200 字符</text><rect x="41" y="716.5" width="5" height="5" fill="#1f5fae"></rect><text id="t52" x="56" y="724" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3b4754"><tspan font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5">ping</tspan> / <tspan font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5">traceroute</tspan> are off unless explicitly enabled</text><text id="t53" x="56" y="740" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7f8a96">ping / traceroute 默认关闭</text><rect x="624" y="506" width="552" height="126" rx="3" fill="#ffffff" stroke="#b8c1ca" stroke-width="1.25"></rect><rect x="624.6" y="506.6" width="550.8" height="32" fill="#fafbfc"></rect><line x1="624" y1="539" x2="1176" y2="539" stroke="#e1e5e9" stroke-width="1"></line><text id="t54" x="640" y="527" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="10" fill="#5d6a77" font-weight="700" letter-spacing="1">LAYER 2 CAVEAT · 第二层注意</text><rect x="641" y="556.5" width="5" height="5" fill="#1f5fae"></rect><text id="t55" x="656" y="564" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3b4754">On IOS a low privilege level is not a boundary if <tspan font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5">enable</tspan> has no secret.</text><text id="t56" x="656" y="580" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7f8a96">IOS 上 enable 没设 secret 时，低权限等级不是边界。</text><rect x="641" y="596.5" width="5" height="5" fill="#1f5fae"></rect><text id="t57" x="656" y="604" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3b4754">Verify on a real VTY that write commands are refused.</text><text id="t58" x="656" y="620" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7f8a96">在真实 VTY 上验证写命令确实被拒。</text></svg>