ath d="m9 12 2.2 2.2 4-4.2"></path></g><text id="t13" x="338" y="175" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" fill="#1d2731" font-weight="600">Layer 1 · command whitelist</text><text id="t14" x="338" y="192" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11.5" fill="#7f8a96">第一层 · 命令白名单（代码）</text><line x1="302" y1="204" x2="548" y2="204" stroke="#e1e5e9" stroke-width="1"></line><text id="t15" x="304" y="223" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3b4754">inside <tspan font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="11.5">DeviceAdapter.run()</tspan></text><text id="t16" x="304" y="240" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3b4754">rejected commands are never sent</text><text id="t17" x="304" y="257" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11.5" fill="#7f8a96">被拒的命令根本不会发出去</text><rect rx="2" fill="#1f5fae" x="507.7" y="142.5" width="40.4" height="15"></rect><text id="t18" x="542" y="153.6" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="9.5" fill="#ffffff" font-weight="700" text-anchor="end" letter-spacing="0.8">CODE</text><rect x="670" y="150" width="270" height="148" rx="3" fill="#ffffff" stroke="#1f5fae" stroke-width="1.8"></rect><rect x="682" y="162" width="26" height="26" rx="3" fill="#1f5fae"></rect><g transform="translate(683.82,163.82) scale(0.93)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="10.5" width="13" height="10" rx="1"></rect><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5M12 14.5v2.5"></path></g><text id="t19" x="718" y="175" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" fill="#1d2731" font-weight="600">Layer 2 · device-side account</text><text id="t20" x="718" y="192" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11.5" fill="#7f8a96">第二层 · 设备侧只读账号</text><line x1="682" y1="204" x2="928" y2="204" stroke="#e1e5e9" stroke-width="1"></line><text id="t21" x="684" y="223" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3b4754">read-only user on the device</text><text id="t22" x="684" y="240" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3b4754">you must configure and verify it</text><text id="t23" x="684" y="257" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11.5" fill="#7f8a96">需要你自己配置并验证</text><rect rx="2" fill="#1f5fae" x="876.0" y="142.5" width="52.0" height="15"></rect><text id="t24" x="922" y="153.6" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="9.5" fill="#ffffff" font-weight="700" text-anchor="end" letter-spacing="0.8">CONFIG</text><rect x="990" y="156" width="170" height="136" rx="3" fill="#ffffff" stroke="#b8c1ca" stroke-width="1.25"></rect><rect x="1002" y="168" width="26" height="26" rx="3" fill="#3b4754"></rect><g transform="translate(1003.82,169.82) scale(0.93)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6.5" width="18" height="11" rx="1"></rect><path d="M6.5 10.3h9.5M14 8.6l2 1.7-2 1.7M17.5 13.7H8M10 12l-2 1.7 2 1.7"></path></g><text id="t25" x="1038" y="181" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13.5" fill="#1d2731" font-weight="600">Network device</text><text id="t26" x="1038" y="198" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11.5" fill="#7f8a96">网络设