e UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3b4754">every command is checked here</text><text id="t12" x="304" y="242" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3b4754">rejected commands are never sent</text><rect rx="2" fill="#1f5fae" x="507.7" y="132.5" width="40.4" height="15"></rect><text id="t13" x="542" y="143.6" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="9.5" fill="#ffffff" font-weight="700" text-anchor="end" letter-spacing="0.8">CODE</text><rect x="670" y="140" width="270" height="132" rx="3" fill="#ffffff" stroke="#1f5fae" stroke-width="1.8"></rect><rect x="682" y="152" width="26" height="26" rx="3" fill="#1f5fae"></rect><g transform="translate(683.82,153.82) scale(0.93)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="10.5" width="13" height="10" rx="1"></rect><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5M12 14.5v2.5"></path></g><text id="t14" x="718" y="170" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13.5" fill="#1d2731" font-weight="600">Layer 2 · device-side account</text><line x1="682" y1="189" x2="928" y2="189" stroke="#e1e5e9" stroke-width="1"></line><text id="t15" x="684" y="207" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3b4754">read-only user on the device</text><text id="t16" x="684" y="224.5" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3b4754">refuses writes if layer 1 fails</text><text id="t17" x="684" y="242" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3b4754">you must configure and verify it</text><rect rx="2" fill="#1f5fae" x="876.0" y="132.5" width="52.0" height="15"><